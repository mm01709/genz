# ═══════════════════════════════════════════════════════════════════════════════
# GENZ Studios — Schema v3 (Production-Ready)
# ─────────────────────────────────────────────────────────────────────────────
# SECURITY MODEL:
#   Studio          → any signed-in user can read | Employee: full CRUD
#   BookingRequest  → owner (sub-based) can read/create | Employee: full CRUD
#   ChatMessage     → owner (sub-based) can read/create | Employee: full CRUD
#   AppNotification → owner (sub-based) can read/create | Employee: full CRUD
#   UserProfile     → private read/create/update (any signed-in) | Employee: full CRUD
#
# KEY CHANGE from v2:
#   BookingRequest/ChatMessage/AppNotification now use identityClaim:"sub"
#   with ownerField storing the Cognito sub (UUID) — eliminates the
#   email case-sensitivity problem that caused Unauthorized on mutations.
#   UserProfile uses allow:private so any signed-in user can read profiles
#   (needed for chat enable/disable check).
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# Studio — read-only for all signed-in users, full CRUD for employees
# ─────────────────────────────────────────────────────────────────────────────
type Studio @model
  @auth(rules: [
    { allow: private, operations: [read] }
    { allow: groups, groups: ["Employee"], operations: [create, update, delete, read] }
  ]) {
  id:           ID!
  name:         String!
  type:         String!
  pricePerHour: Int!
  description:  String
  image:        String
  available:    Boolean
}

# ─────────────────────────────────────────────────────────────────────────────
# BookingRequest — owner auth via Cognito sub (avoids email case issues)
# clientEmail stored separately for display/query purposes
# ─────────────────────────────────────────────────────────────────────────────
type BookingRequest @model
  @auth(rules: [
    { allow: private, operations: [create] }
    { allow: owner,   operations: [read, update, delete] }
    { allow: groups,  groups: ["Employee"], operations: [create, update, delete, read] }
  ]) {
  id:                ID!
  clientEmail:       String! @index(name: "byClientEmail", queryField: "bookingRequestsByClientEmail")
  clientName:        String
  clientPhone:       String
  studio:            String!
  date:              String!
  hours:             String!
  price:             String!
  equipment:         String
  status:            String
  fullStartDateTime: String! @index(name: "byStartDate", queryField: "bookingRequestsByStart")
  fullEndDateTime:   String!
}

# ─────────────────────────────────────────────────────────────────────────────
# ChatMessage — owner auth via Cognito sub
# ─────────────────────────────────────────────────────────────────────────────
type ChatMessage @model
  @auth(rules: [
    { allow: private, operations: [create] }
    { allow: owner,   operations: [read] }
    { allow: groups,  groups: ["Employee"], operations: [create, update, delete, read] }
  ]) {
  id:          ID!
  senderName:  String
  senderEmail: String
  clientEmail: String! @index(name: "byClientEmail", queryField: "chatMessagesByClientEmail")
  text:        String
  time:        String
  messageType: String
  parentId:    String @index(name: "byParent", queryField: "chatMessagesByParent")
}

# ─────────────────────────────────────────────────────────────────────────────
# AppNotification — any signed-in user can create (needed for employee inbox)
# owner can read their own notifications
# ─────────────────────────────────────────────────────────────────────────────
type AppNotification @model
  @auth(rules: [
    { allow: private, operations: [create] }
    { allow: owner,   ownerField: "clientEmail", identityClaim: "email", operations: [read] }
    { allow: groups,  groups: ["Employee"], operations: [create, update, delete, read] }
  ]) {
  id:          ID!
  clientEmail: String! @index(name: "byClientEmail", queryField: "appNotificationsByClientEmail")
  title:       String
  body:        String
  type:        String
  time:        String
  read:        Boolean
}

# ─────────────────────────────────────────────────────────────────────────────
# UserProfile — private (any signed-in user) for read/create/update
# This allows clients to check chatEnabled for themselves
# Employees get full CRUD to manage all profiles
# ─────────────────────────────────────────────────────────────────────────────
type UserProfile @model
  @auth(rules: [
    { allow: private, operations: [read, create, update] }
    { allow: groups,  groups: ["Employee"], operations: [create, update, delete, read] }
  ]) {
  id:          ID!
  email:       String! @index(name: "byEmail", queryField: "userProfilesByEmail")
  name:        String
  image:       String
  type:        String
  chatEnabled: Boolean
  lastUpdated: AWSDateTime
}
