# GENZ Studios — Schema v5 (Simple + Working)
# allow:private على كل حاجة — أي user مسجل دخول يقدر يقرا ويكتب
# التصفية بتتعمل في الكود مش في AppSync — أبسط وأضمن

type Studio @model
  @auth(rules: [
    { allow: private }
  ]) {
  id:           ID!
  name:         String!
  type:         String!
  pricePerHour: Int!
  description:  String
  image:        String
  available:    Boolean
  sortOrder:    Int
}

type BookingRequest @model
  @auth(rules: [
    { allow: private }
  ]) {
  id:                ID!
  clientEmail:       String! @index(name: "byClientEmail", queryField: "bookingRequestsByClientEmail")
  clientName:        String
  clientPhone:       String
  studio:            String!
  date:              String!
  hours:             String!
  price:             String!
  equipment:         String
  status:            String
  fullStartDateTime: String! @index(name: "byStartDate", queryField: "bookingRequestsByStart")
  fullEndDateTime:   String!
}

type ChatMessage @model
  @auth(rules: [
    { allow: private }
  ]) {
  id:          ID!
  senderName:  String
  senderEmail: String
  clientEmail: String! @index(name: "byClientEmail", queryField: "chatMessagesByClientEmail")
  text:        String
  time:        String
  messageType: String
  parentId:    String @index(name: "byParent", queryField: "chatMessagesByParent")
}

type AppNotification @model
  @auth(rules: [
    { allow: private }
  ]) {
  id:          ID!
  clientEmail: String! @index(name: "byClientEmail", queryField: "appNotificationsByClientEmail")
  title:       String
  body:        String
  type:        String
  time:        String
  read:        Boolean
}

type GenzService @model
  @auth(rules: [
    { allow: private }
  ]) {
  id:          ID!
  category:    String!
  name:        String!
  nameAr:      String
  description: String
  price:       Int
  priceLabel:  String
  sortOrder:   Int
  available:   Boolean
}

type UserProfile @model
  @auth(rules: [
    { allow: private }
  ]) {
  id:          ID!
  email:       String! @index(name: "byEmail", queryField: "userProfilesByEmail")
  name:        String
  image:       String
  type:        String
  chatEnabled: Boolean
  lastUpdated: AWSDateTime
}
